name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stocks_user
          POSTGRES_PASSWORD: stocks_password
          POSTGRES_DB: stocks_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://stocks_user:stocks_password@localhost:5432/stocks_db
      SECRET_KEY: test-secret-key-for-ci-only
      DEBUG: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./stocks_products
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django settings
        working-directory: ./stocks_products
        run: python manage.py check

      - name: Check migrations
        working-directory: ./stocks_products
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: ./stocks_products
        run: python manage.py test logistic --verbosity=2

  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -p 22 vylarrja@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            cd /home/vylarrja
            if [ -d crud/.git ]; then
              cd crud
              git fetch origin main
              git reset --hard origin/main
            else
              git clone git@github.com:UvarovNik/crud.git
              cd crud
            fi
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py collectstatic --noinput
            python manage.py migrate
            sudo systemctl restart gunicorn
          ENDSSH
